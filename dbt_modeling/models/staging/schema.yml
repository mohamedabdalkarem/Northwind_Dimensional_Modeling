              config:
                severity: warn
      - name: product_id
        description: "FK to stg_northwind__products.id."
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('stg_northwind__products')
                field: id
              config:
                severity: warn
      - name: status_id
        description: "Line status code (0 None, 1 Allocated, 2 Invoiced, 3 Shipped, 4 On Order, 5 No Stock)."
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
              config:
                severity: warn
      - name: quantity
        description: "Units ordered on this line."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: unit_price
        description: "Price per unit on this line."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: discount
        description: "Discount rate applied to this line, 0-1."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: _loaded_at
        description: "Ingestion timestamp."
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: stg_northwind__invoices
