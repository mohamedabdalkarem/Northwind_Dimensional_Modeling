version: 2

models:
  - name: dim_order_date
    description: "Conformed view of dim_date_calendar aliased for order_date joins. Allows BI tools to join the same date dimension multiple times without column-name ambiguity (e.g., fact table has order_date_key, shipped_date_key, required_date_key)."

  - name: dim_ship_date
    description: "Conformed view of dim_date_calendar aliased for shipped_date joins. Same physical table, different logical role."

  - name: dim_required_date
    description: "Conformed view of dim_date_calendar aliased for required_date / due_date joins. Same physical table, different logical role."

  - name: dim_date_calendar
    description: "Date dimension, 1990-01-01 to 2030-12-31. Every date column in the warehouse joins to date_key."
    columns:
      - name: date_key
      - name: date_day

  - name: dim_employee
    description: "Employee dimension, Type 1 (overwrite). One row per employee, keyed off the staging id."
    columns:
      - name: employee_key
        description: "Surrogate key, dbt_utils.generate_surrogate_key(['id'])."
      - name: employee_id
        description: "Natural key from the source system, kept for traceability/debugging."

  - name: dim_supplier
    description: "Supplier dimension, Type 1 (overwrite). One row per supplier, keyed off the staging id."
    columns:
      - name: supplier_key
        description: "Surrogate key, dbt_utils.generate_surrogate_key(['id'])."
      - name: supplier_id
        description: "Natural key from the source system, kept for traceability/debugging."

  - name: dim_shipper
    description: "Shipper dimension, Type 1 (overwrite). One row per shipper, keyed off the staging id."
    columns:
      - name: shipper_key
        description: "Surrogate key, dbt_utils.generate_surrogate_key(['id'])."
      - name: shipper_id
        description: "Natural key from the source system, kept for traceability/debugging."

  - name: dim_customer
    description: "Customer dimension, Type 1 (overwrite). One row per customer, keyed off the staging id."
    columns:
      - name: customer_key
        description: "Surrogate key, dbt_utils.generate_surrogate_key(['id'])."
      - name: customer_id
        description: "Natural key from the source system, kept for traceability/debugging."

  - name: dim_product
    description: "Product dimension, Type 1 (overwrite). One row per product, keyed off the staging id."
    columns:
      - name: product_key
        description: "Surrogate key, dbt_utils.generate_surrogate_key(['id'])."
      - name: product_id
        description: "Natural key from the source system, kept for traceability/debugging."

  - name: fct_order_lifecycle
    description: "Order lifecycle fact. Grain: one row per order, updated in place as the order progresses. Answers 'are we hitting delivery commitments?' via days_to_ship and days_late. Incremental, merged on order_id. required_date comes from invoices.due_date (Northwind orders have no native required date)."
    columns:
      - name: order_id
        description: "Natural key from stg_northwind__orders.id. One row per order - the merge key for the incremental strategy."
        data_tests:
          - unique
          - not_null
      - name: order_date_key
        description: "FK to dim_date_calendar, resolved from orders.order_date."
      - name: required_date_key
        description: "FK to dim_date_calendar, resolved from invoices.due_date (the delivery commitment). -1 when no due date exists."
      - name: shipped_date_key
        description: "FK to dim_date_calendar, resolved from orders.shipped_date. -1 while the order is unshipped."
      - name: order_date
        description: "Degenerate dimension - the order date as a date."
      - name: required_date
        description: "Degenerate dimension - the delivery commitment date (invoices.due_date)."
      - name: shipped_date
        description: "Degenerate dimension - the date the order shipped."
      - name: days_to_ship
        description: "Lag measure - days between order_date and shipped_date."
      - name: days_late
        description: "Lag measure - days between shipped_date and required_date. Positive = shipped past the commitment."
      - name: is_shipped
        description: "Lifecycle flag - true once the order has a shipped_date."
      - name: is_late
        description: "Lifecycle flag - true when shipped_date is later than required_date."
      - name: _loaded_at
        description: "greatest of orders/invoices load and modified timestamps - the incremental cursor."

  - name: obt_sales_overview
    description: "One Big Table for sales reporting. Joins fct_sales_transaction to all conformed dimensions (customer, employee, shipper, product, order_date). BI-ready flat table for dashboards and ad-hoc analysis."
    columns:
      - name: order_line_id
      - name: order_number
      - name: order_date
      - name: quantity
      - name: unit_price
      - name: discount
      - name: gross_amount
      - name: net_amount
      - name: customer_company
      - name: customer_contact
      - name: customer_city
      - name: customer_state
      - name: customer_country
      - name: customer_email
      - name: employee_name
      - name: employee_title
      - name: shipper_company
      - name: product_code
      - name: product_name
      - name: product_category
      - name: standard_cost
      - name: list_price
      - name: product_discontinued
      - name: order_year
      - name: order_month
      - name: order_quarter
      - name: order_iso_week
      - name: order_day_name
      - name: order_is_weekend
      - name: order_is_holiday

  - name: obt_product_inventory
    description: "One Big Table for inventory reporting. Joins fct_inventory_snapshot to dim_product and snapshot date. BI-ready flat table for inventory dashboards. units_in_stock is SEMI-ADDITIVE (additive across products, NOT across dates)."
    columns:
      - name: snapshot_date_key
      - name: units_in_stock
      - name: reorder_level
      - name: target_level
      - name: minimum_reorder_quantity
      - name: discontinued
      - name: is_below_reorder
      - name: is_at_target
      - name: product_id
      - name: product_code
      - name: product_name
      - name: product_category
      - name: quantity_per_unit
      - name: standard_cost
      - name: list_price
      - name: snapshot_year
      - name: snapshot_month
      - name: snapshot_quarter
      - name: snapshot_iso_week
      - name: snapshot_day_name
      - name: snapshot_is_weekend
      - name: snapshot_is_holiday

  - name: obt_customer_reporting
    description: "One Big Table for customer 360 reporting. Aggregates fct_sales_transaction and fct_order_lifecycle to customer grain. BI-ready for customer health, CLV, and retention dashboards."
    columns:
      - name: customer_key
      - name: customer_id
      - name: company_name
      - name: contact_full_name
      - name: email_address
      - name: city
      - name: country_region
      - name: total_gross_sales
      - name: total_net_sales
      - name: total_units_sold
      - name: order_count
      - name: first_order_date
      - name: last_order_date
      - name: avg_order_value
      - name: late_order_count
      - name: shipped_order_count
      - name: avg_days_to_ship
      - name: avg_days_late
      - name: late_ship_rate
      - name: days_since_last_order

  - name: fct_inventory_snapshot
    description: "Inventory snapshot fact. Grain: one row per product per day. Built by cross-joining dim_date_calendar with dim_product and computing running stock from inventory_transactions. Serves the Product Inventory business process. units_in_stock is SEMI-ADDITIVE — you CAN sum it across products but NOT across dates (summing across dates double-counts stock). Clustered on snapshot_date_key, product_key."
    columns:
      - name: snapshot_date_key
        description: "FK to dim_date_calendar - the date of the inventory snapshot."
      - name: product_key
        description: "FK to dim_product."
      - name: units_in_stock
        description: "Semi-additive measure - running stock balance at end of snapshot_date. Additive across products, NOT across dates."
      - name: reorder_level
        description: "From dim_product - stock level that triggers reorder."
      - name: target_level
        description: "From dim_product - target stock level to replenish to."
      - name: minimum_reorder_quantity
        description: "From dim_product - minimum order quantity when reordering."
      - name: discontinued
        description: "From dim_product - whether the product is discontinued."
      - name: is_below_reorder
        description: "Flag - true when units_in_stock <= reorder_level."
      - name: is_at_target
        description: "Flag - true when units_in_stock >= target_level."
      - name: _loaded_at
        description: "Load timestamp."

  - name: fct_sales_transaction
    description: "Sales fact. Grain: one row per order line (one row per stg_northwind__order_details record). Incremental, merged on order_line_id."
    columns:
      - name: order_line_id
        description: "Natural key from stg_northwind__order_details.id. One row per order line - the merge key for the incremental strategy."
        data_tests:
          - unique
          - not_null
      - name: order_number
        description: "Degenerate dimension - the order id, kept on the fact for traceability without a separate order dimension."
      - name: order_date_key
        description: "FK to dim_date_calendar, resolved from orders.order_date."
      - name: customer_key
        description: "FK to dim_customer."
      - name: employee_key
        description: "FK to dim_employee."
      - name: shipper_key
        description: "FK to dim_shipper."
      - name: product_key
        description: "FK to dim_product."
      - name: quantity
        description: "Additive measure - units sold on this order line."
      - name: unit_price
        description: "Additive-safe attribute - price per unit at time of sale."
      - name: discount
        description: "Discount rate applied to this order line, 0-1."
      - name: gross_amount
        description: "Additive measure - quantity * unit_price, before discount."
      - name: net_amount
        description: "Additive measure - quantity * unit_price * (1 - discount)."
      - name: _loaded_at
        description: "greatest(order_lines._loaded_at, orders.modified_at) - the incremental cursor. order_details has no modified_at of its own, so its staging load timestamp stands in for it."
