version: 2

models:
  - name: dim_date_calendar
    description: "Date dimension, 1990-01-01 to 2030-12-31. Every date column in the warehouse joins to date_key."
    columns:
      - name: date_key
      - name: date_day

  - name: dim_employee
    description: "Employee dimension, Type 1 (overwrite). One row per employee, keyed off the staging id."
    columns:
      - name: employee_key
        description: "Surrogate key, dbt_utils.generate_surrogate_key(['id'])."
      - name: employee_id
        description: "Natural key from the source system, kept for traceability/debugging."

  - name: dim_supplier
    description: "Supplier dimension, Type 1 (overwrite). One row per supplier, keyed off the staging id."
    columns:
      - name: supplier_key
        description: "Surrogate key, dbt_utils.generate_surrogate_key(['id'])."
      - name: supplier_id
        description: "Natural key from the source system, kept for traceability/debugging."

  - name: dim_shipper
    description: "Shipper dimension, Type 1 (overwrite). One row per shipper, keyed off the staging id."
    columns:
      - name: shipper_key
        description: "Surrogate key, dbt_utils.generate_surrogate_key(['id'])."
      - name: shipper_id
        description: "Natural key from the source system, kept for traceability/debugging."

  - name: dim_customer
    description: "Customer dimension, Type 1 (overwrite). One row per customer, keyed off the staging id."
    columns:
      - name: customer_key
        description: "Surrogate key, dbt_utils.generate_surrogate_key(['id'])."
      - name: customer_id
        description: "Natural key from the source system, kept for traceability/debugging."

  - name: dim_product
    description: "Product dimension, Type 1 (overwrite). One row per product, keyed off the staging id."
    columns:
      - name: product_key
        description: "Surrogate key, dbt_utils.generate_surrogate_key(['id'])."
      - name: product_id
        description: "Natural key from the source system, kept for traceability/debugging."

  - name: fct_order_lifecycle
    description: "Order lifecycle fact. Grain: one row per order, updated in place as the order progresses. Answers 'are we hitting delivery commitments?' via days_to_ship and days_late. Incremental, merged on order_id. required_date comes from invoices.due_date (Northwind orders have no native required date)."
    columns:
      - name: order_id
        description: "Natural key from stg_northwind__orders.id. One row per order - the merge key for the incremental strategy."
        data_tests:
          - unique
          - not_null
      - name: order_date_key
        description: "FK to dim_date_calendar, resolved from orders.order_date."
      - name: required_date_key
        description: "FK to dim_date_calendar, resolved from invoices.due_date (the delivery commitment). -1 when no due date exists."
      - name: shipped_date_key
        description: "FK to dim_date_calendar, resolved from orders.shipped_date. -1 while the order is unshipped."
      - name: order_date
        description: "Degenerate dimension - the order date as a date."
      - name: required_date
        description: "Degenerate dimension - the delivery commitment date (invoices.due_date)."
      - name: shipped_date
        description: "Degenerate dimension - the date the order shipped."
      - name: days_to_ship
        description: "Lag measure - days between order_date and shipped_date."
      - name: days_late
        description: "Lag measure - days between shipped_date and required_date. Positive = shipped past the commitment."
      - name: is_shipped
        description: "Lifecycle flag - true once the order has a shipped_date."
      - name: is_late
        description: "Lifecycle flag - true when shipped_date is later than required_date."
      - name: _loaded_at
        description: "greatest of orders/invoices load and modified timestamps - the incremental cursor."

  - name: fct_sales_transaction
    description: "Sales fact. Grain: one row per order line (one row per stg_northwind__order_details record). Incremental, merged on order_line_id."
    columns:
      - name: order_line_id
        description: "Natural key from stg_northwind__order_details.id. One row per order line - the merge key for the incremental strategy."
        data_tests:
          - unique
          - not_null
      - name: order_number
        description: "Degenerate dimension - the order id, kept on the fact for traceability without a separate order dimension."
      - name: order_date_key
        description: "FK to dim_date_calendar, resolved from orders.order_date."
      - name: customer_key
        description: "FK to dim_customer."
      - name: employee_key
        description: "FK to dim_employee."
      - name: shipper_key
        description: "FK to dim_shipper."
      - name: product_key
        description: "FK to dim_product."
      - name: quantity
        description: "Additive measure - units sold on this order line."
      - name: unit_price
        description: "Additive-safe attribute - price per unit at time of sale."
      - name: discount
        description: "Discount rate applied to this order line, 0-1."
      - name: gross_amount
        description: "Additive measure - quantity * unit_price, before discount."
      - name: net_amount
        description: "Additive measure - quantity * unit_price * (1 - discount)."
      - name: _loaded_at
        description: "greatest(order_lines._loaded_at, orders.modified_at) - the incremental cursor. order_details has no modified_at of its own, so its staging load timestamp stands in for it."
